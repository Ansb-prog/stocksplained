html[data-size="1"]{font-size:129%}
html[data-size="2"]{font-size:146%}
body{margin:0;min-height:100%;background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%) fixed;color:var(--ink);font-family:var(--font);line-height:1.5}
html[lang="ar"] body{line-height:1.75;font-size:1.06rem}
h1,h2,h3{line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.86rem} .num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.deco{position:fixed;z-index:-1;border-radius:22px;background:rgba(255,255,255,.55);pointer-events:none;animation:float 14s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px) rotate(8deg)}}

/* Top bar */
.topbar{position:sticky;top:0;z-index:40;backdrop-filter:blur(10px);background:rgba(251,228,211,.82)}
.bar{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-height:48px;margin-inline-end:auto}
.brand b{font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
.brand-mark{width:46px;height:46px;border-radius:14px;object-fit:cover;box-shadow:var(--sh-sm);flex:none}
.wordmark{font-weight:800;letter-spacing:.02em;font-size:1.1rem;direction:ltr;unicode-bidi:isolate}.wordmark span{color:var(--accent)}
.modal > *{flex-shrink:0}
.logo-banner{background:#111820;border-radius:20px;display:grid;place-items:center;padding:6px;overflow:hidden}.logo-banner img{width:100%;max-width:360px;height:auto;display:block}
.brand small{display:block;color:var(--muted);font-size:.74rem;line-height:1.2}
.pillbtn{min-height:44px;padding:0 14px;border-radius:999px;border:0;background:var(--surface);box-shadow:var(--sh-sm);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .2s var(--ease),box-shadow .2s}
.pillbtn:hover{transform:translateY(-2px) scale(1.04);box-shadow:var(--sh-lg)}
.seg{display:inline-flex;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--sh-sm)}
.seg button{min-height:38px;padding:0 14px;border:0;border-radius:999px;background:transparent;font-weight:700;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
svg.i{width:1.2em;height:1.2em;flex:none}

/* Main */
main{max-width:1120px;margin:0 auto;padding:18px 16px 190px;display:flex;flex-direction:column;gap:22px}
main.enter > *{animation:rise .55s var(--ease) both}
main.enter > *:nth-child(2){animation-delay:.05s} main.enter > *:nth-child(3){animation-delay:.1s} main.enter > *:nth-child(4){animation-delay:.15s} main.enter > *:nth-child(5){animation-delay:.2s} main.enter > *:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:.25;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
.footer{max-width:1120px;margin:0 auto;padding:0 16px 140px;color:var(--muted);font-size:.84rem;display:flex;gap:8px}

.sheet{background:var(--surface);border-radius:var(--r-xl);padding:24px;box-shadow:var(--sh-sm);display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
html[lang="ar"] .eyebrow{letter-spacing:0}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.tile{position:relative;border:0;border-radius:var(--r-lg);padding:20px;min-height:170px;display:flex;flex-direction:column;gap:6px;text-align:start;cursor:pointer;color:#fff;box-shadow:var(--sh-sm);transition:transform .28s var(--ease),box-shadow .28s var(--ease);overflow:hidden}
.tile:hover{transform:translateY(-6px) scale(1.035);box-shadow:var(--sh-lg);z-index:2}
.tile:active{transform:scale(.97)}
.tile .big{font-size:2.6rem;font-weight:800;line-height:1;letter-spacing:-.02em}
.tile .lbl{opacity:.9;font-weight:500}
.tile.dark-text{color:var(--ink)}
.tile .glow{position:absolute;inset-inline-end:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14)}
.c-night{background:var(--t-night)} .c-plum{background:var(--t-plum)} .c-coral{background:var(--t-coral)} .c-orange{background:var(--t-orange)} .c-sun{background:var(--t-sun)} .c-sky{background:var(--t-sky)} .c-mint{background:var(--t-mint)}
.bar-xp{height:10px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:auto}
.bar-xp span{display:block;height:100%;border-radius:999px;background:var(--t-sun);transition:width .9s var(--ease)}

/* Buttons */
.btn{min-height:52px;padding:0 22px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .2s var(--ease),box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:var(--sh-sm)}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--typ-soft);color:var(--typ);white-space:nowrap}
.chip.sample{background:var(--accent-soft);color:var(--accent)}
.chip.on-dark{background:rgba(255,255,255,.18);color:#fff}
.z-low{background:var(--low-soft);color:var(--low)} .z-typ{background:var(--typ-soft);color:var(--typ)} .z-high{background:var(--high-soft);color:var(--high)}
.zdot{width:.55em;height:.55em;border-radius:50%;background:currentColor;flex:none}
.z-typ .zdot{border-radius:2px;height:.25em;width:.85em} .z-low .zdot{background:transparent;border:2px solid currentColor}
.up{color:var(--up)} .down{color:var(--down)}
.r-steady{background:#E3F4EC;color:#16704F}
.chip.sh-yes{background:#DDF1EE;color:#0B5E5D}.chip.sh-no{background:#EEEAF0;color:#5E5466}
.chip.on-dark.sh-yes{background:rgba(255,255,255,.92);color:#0B5E5D}.chip.on-dark.sh-no{background:rgba(255,255,255,.2);color:#fff}
.chip svg.i{width:1em;height:1em}
.sh-box{border:2px solid #CFE8E4;border-radius:var(--r-lg);padding:18px;background:#F4FBFA}
.sh-row{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--surface)}
.sh-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--typ-soft);color:var(--typ);font-weight:800}
.sh-row.pass .sh-ic{background:#0E6E6D;color:#fff}.sh-row.fail .sh-ic{background:#8A7E92;color:#fff}
.sh-bar{position:relative;height:10px;border-radius:999px;background:var(--line);direction:ltr}.sh-bar i{display:block;height:100%;border-radius:999px;background:#0E6E6D;animation:slidew .9s var(--ease) both}
.sh-row.fail .sh-bar i{background:#8A7E92}.sh-bar b{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px}
@keyframes slidew{from{width:0}}
.road-wrap{position:relative;max-width:760px;width:100%;margin:0 auto;direction:ltr}
.road-svg{position:absolute;left:0;top:0;width:100%;height:calc(100% - 40px);overflow:visible}
.draw-seg{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s var(--ease) .9s forwards}
.cp{position:absolute;transform:translate(-50%,-50%);z-index:2}
.cp-node{position:relative;width:78px;height:78px;border-radius:50%;border:5px solid #fff;box-shadow:var(--sh-lg);display:grid;place-items:center;cursor:pointer;transition:transform .25s var(--ease);font:inherit}
.cp-node svg.i{width:30px;height:30px}
.cp-node:hover{transform:scale(1.14)}
.cp-num{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;background:#fff;color:var(--ink);font-weight:800;font-size:.8rem;display:grid;place-items:center;box-shadow:var(--sh-sm)}
.cp.done .cp-node{background:var(--t-mint);color:#fff}
.cp.current .cp-node{background:var(--accent);color:#fff;animation:beat 1.8s ease-in-out infinite}
.cp.locked .cp-node{background:#E9DDD3;color:#9A8F99}
.cp-label{position:absolute;top:50%;transform:translateY(-50%);width:min(250px,34vw);text-align:start;background:var(--surface);border:0;border-radius:16px;padding:10px 14px;box-shadow:var(--sh-sm);display:flex;flex-direction:column;gap:2px;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s;font:inherit;color:var(--ink)}
.cp-label:hover{transform:translateY(-50%) scale(1.05);box-shadow:var(--sh-lg)}
.cp.lbl-right .cp-label{left:calc(100% + 16px)} .cp.lbl-left .cp-label{right:calc(100% + 16px)}
html[lang="ar"] .cp-label{direction:rtl}
.cp.locked .cp-label{opacity:.72}
.cp.current .cp-label{border:3px solid var(--accent)}
.cp.arrive .cp-node{animation:popIn .8s var(--ease) both, beat 1.8s ease-in-out .8s infinite}
@keyframes popIn{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes beat{0%,100%{box-shadow:0 0 0 0 rgba(201,75,29,.45),var(--sh-lg)}50%{box-shadow:0 0 0 18px rgba(201,75,29,0),var(--sh-lg)}}
.sign{position:absolute;left:50%;transform:translate(-50%,-50%);z-index:1;background:#0B6B3A;color:#fff;border:3px solid #fff;outline:2px solid #0B6B3A;border-radius:10px;padding:6px 18px;font-weight:800;box-shadow:var(--sh-lg);text-align:center;display:flex;flex-direction:column;line-height:1.2;white-space:nowrap}
.sign small{font-size:.7rem;opacity:.85;font-weight:600}
.pin{position:absolute;transform:translate(-50%,-100%);z-index:3;pointer-events:none;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
@keyframes bob{50%{margin-top:-8px}}
.finish{position:absolute;left:50%;transform:translateX(-50%);font-size:2.4rem}
.progress-road{height:12px;border-radius:999px;background:var(--line);overflow:hidden}.progress-road span{display:block;height:100%;background:linear-gradient(90deg,var(--t-sun),var(--accent-2));border-radius:999px;transition:width 1s var(--ease)}
.burst{position:absolute;left:50%;top:50%;width:0;height:0;z-index:4;pointer-events:none}
.burst i{position:absolute;width:10px;height:10px;border-radius:3px;background:var(--c);transform:rotate(var(--a)) translateY(0);animation:fly 1.2s var(--ease) forwards}
@keyframes fly{to{transform:rotate(var(--a)) translateY(-70px) rotate(180deg);opacity:0}}
.mod-badge{width:60px;height:60px;border-radius:18px;background:var(--ink);color:var(--t-sun);display:grid;place-items:center}.mod-badge svg.i{width:30px;height:30px}
.mod-card{animation:slideCard .45s var(--ease) both}
@keyframes slideCard{from{opacity:.2;transform:translateX(40px)}}
[dir="rtl"] .mod-card{animation-name:slideCardR}
@keyframes slideCardR{from{opacity:.2;transform:translateX(-40px)}}
.flags.checks li{background:#E3F4EC}
.cert{border-radius:20px;padding:10px;background:linear-gradient(135deg,var(--t-sun),var(--accent-2))}.cert-in{background:#fff;border-radius:14px;padding:26px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
@media (max-width:560px){.cp-node{width:62px;height:62px}.cp-label{width:min(170px,40vw);padding:8px 10px}.cp-label b{font-size:.9rem}}
.sk-dots{display:flex;gap:6px}.sk-dots i{width:22px;height:8px;border-radius:4px;background:var(--line);transition:background .3s}.sk-dots i.on{background:#0E6E6D}
table.cmp{width:100%;border-collapse:separate;border-spacing:0 6px}table.cmp th,table.cmp td{text-align:start;padding:10px 12px;background:var(--bg)}
table.cmp tr:first-child th{background:var(--ink);color:#fff}table.cmp tr:first-child th:first-child{background:transparent}
table.cmp td:last-child{background:#DDF1EE;font-weight:600} .r-balanced{background:#FFF1D6;color:#7A4E00} .r-bold{background:#FCE4E0;color:#A1301F}

/* Hero */
.hello{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--t-sun);display:grid;place-items:center;font-weight:800;font-size:1.5rem;color:var(--ink);box-shadow:var(--sh-sm)}
.tour-card{display:flex;align-items:center;gap:16px;background:var(--ink);color:#fff;border-radius:var(--r-xl);padding:18px 22px;flex-wrap:wrap}
.tour-card p{opacity:.85}

/* Orange calculator */
.orange-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.basket-card{border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:10px}
.basket-cash{background:#FBF1EA} .basket-inv{background:#FFF4DE}
.basket{width:100%;height:auto;display:block}
.drop{transform-box:fill-box;transform-origin:center bottom}
.drop .fruit{fill:#F08A2E;transition:fill .8s var(--ease)}
.drop .shine{fill:#fff;opacity:.35;transition:opacity .6s}
.drop .leaf{fill:#2E8B57;transition:fill .8s}
.drop .spots circle{fill:#4A3418}.drop .spots{opacity:0;transition:opacity .8s}
.drop .orange{transform-box:fill-box;transform-origin:center bottom;transition:transform .8s var(--ease)}
.drop.st-g .fruit{fill:#F5B841}
.drop.st-r .fruit{fill:#8A6A3B}.drop.st-r .shine{opacity:0}.drop.st-r .leaf{fill:#5E4A2B}.drop.st-r .spots{opacity:1}.drop.st-r .orange{transform:translateY(2px) scale(.9,.86)}
.drop.st-h:not(.leave){opacity:0}
.drop.leave{animation:leave .45s var(--ease) both}
@keyframes leave{to{transform:translateY(-24px) scale(.2);opacity:0}}
.basket .more{font:700 15px var(--font);fill:var(--ink)}
.drop.fall{animation:fall 1.25s cubic-bezier(.33,0,.67,1) both}
@keyframes fall{
  0%{transform:translate(var(--dx),-340px) rotate(var(--rot));opacity:0}
  8%{opacity:1}
  50%{transform:translate(0,0) rotate(0);animation-timing-function:ease-out}
  64%{transform:translate(calc(var(--dx) * -.4),-26px) rotate(calc(var(--rot) * -.3));animation-timing-function:ease-in}
  76%{transform:translate(0,0) scale(1.06,.92)}
  85%{transform:translate(calc(var(--dx) * .15),-8px) scale(.98,1.02)}
  93%{transform:translate(0,0) scale(1.02,.98)}
  100%{transform:none;opacity:1}}

.calc-ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.9rem;display:flex;justify-content:space-between;gap:8px}
input[type="range"]{width:100%;accent-color:var(--accent);min-height:36px}
input[type="number"],input[type="text"],textarea{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:16px;min-height:52px;padding:8px 14px;width:100%}
textarea{min-height:130px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{min-height:40px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;transition:transform .2s var(--ease)}
.quick button:hover{transform:scale(1.06)}
.quick button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.callout{border-radius:var(--r-md);padding:14px 16px;background:var(--accent-soft);display:flex;gap:12px;align-items:flex-start}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-inline-end:6px}
.chart{width:100%;height:auto;display:block;direction:ltr}
.chart text{font-family:var(--font);font-size:13px;fill:var(--muted)}
.chart.hoverable{cursor:crosshair;touch-action:pan-y}
.chart .hov{pointer-events:none}.chart .hx{stroke:var(--ink);stroke-opacity:.45;stroke-width:1.2;stroke-dasharray:4 4}
.chart .htag{fill:var(--ink)}.chart text.htt{fill:#fff;font-weight:700;font-size:12px}
.chart .hdot{fill:var(--accent);stroke:#fff;stroke-width:3}.chart .hcand{fill:none;stroke:var(--accent);stroke-width:2}
.chart .hbox{fill:var(--surface);stroke:var(--line);stroke-width:1.5;filter:drop-shadow(0 4px 10px rgba(60,20,0,.15))}
.chart text.hbh{fill:var(--ink);font-weight:800;font-size:13px}.chart text.hbt{fill:var(--ink);font-size:13px}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}}
.note{font-size:.84rem;color:var(--muted);background:rgba(255,255,255,.6);border-radius:12px;padding:10px 12px}

/* Stocks */
.stock-tile{min-height:190px}
.stock-tile .tick{font-size:.8rem;font-weight:700;opacity:.85;letter-spacing:.05em}
.stock-tile .nm{font-size:1.15rem;font-weight:700}
.stock-tile .px{font-size:1.8rem;font-weight:800;margin-top:auto}
.logo{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.05rem;border:4px solid var(--surface);box-shadow:var(--sh-sm);flex:none}
.detail-head{border-radius:var(--r-xl);padding:26px 24px 70px;color:#fff;position:relative;overflow:hidden}
.detail-head .glow{position:absolute;inset-inline-end:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.detail-body{margin-top:-56px;position:relative}
.detail-body .logo{width:80px;height:80px;font-size:1.4rem;margin-top:-64px}
.price-big{font-size:2.4rem;font-weight:800;letter-spacing:-.02em}
.periods{display:flex;gap:6px;flex-wrap:wrap}
.periods button{min-height:40px;padding:0 14px;border-radius:999px;border:0;background:var(--accent-soft);color:var(--accent);font-weight:800;cursor:pointer;transition:transform .2s var(--ease)}
.periods button:hover{transform:scale(1.06)}
.periods button[aria-pressed="true"]{background:var(--accent);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.stat{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:start;transition:transform .22s var(--ease),border-color .2s,box-shadow .22s}
.stat:hover{transform:scale(1.03);border-color:var(--accent-2);box-shadow:var(--sh-sm)}
.stat .k{font-weight:600;color:var(--muted);font-size:.9rem}
.stat .v{font-size:1.3rem;font-weight:800}
.range{direction:ltr;display:flex;flex-direction:column;gap:6px}
.track{position:relative;height:12px;background:var(--line);border-radius:999px}
.band{position:absolute;top:0;bottom:0;background:var(--typ-soft);border:2px solid var(--typ);border-radius:999px}
.marker{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);animation:slidein .8s var(--ease) both}
@keyframes slidein{from{left:0}}
.marker.low{background:var(--low)} .marker.typ{background:var(--typ)} .marker.high{background:var(--high)}
.range-lbl{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}

/* News */
.news-card{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;transition:transform .25s var(--ease),box-shadow .25s}
.news-card:hover{transform:translateY(-4px) scale(1.01);box-shadow:var(--sh-lg)}
.why{background:var(--accent-soft);border-radius:14px;padding:12px 14px}
.why b{color:var(--accent);font-size:.84rem;display:block}
.src{display:flex;gap:6px;flex-wrap:wrap}
.src span{font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--typ-soft);color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.transcript{font-size:.9rem;border-inline-start:4px solid var(--line);padding:4px 14px;color:var(--muted);animation:rise .4s var(--ease)}
.shimmer{background:linear-gradient(90deg,var(--line) 0%,#fff 50%,var(--line) 100%);background-size:200% 100%;animation:shim 1.2s linear infinite;border-radius:10px;height:14px}
@keyframes shim{to{background-position:-200% 0}}
@media (max-width:560px){.news-card{grid-template-columns:1fr}}

/* Practice */

.xp{background:var(--t-sun);color:var(--ink);border-radius:999px;padding:2px 10px;font-weight:800}
.levelup{text-align:center;align-items:center}
.levelup .hex{width:110px;height:120px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;color:#fff;animation:spinIn .9s var(--ease) both}
@keyframes spinIn{from{transform:scale(0) rotate(-180deg)}}

/* Guided tour */
#tour-ring{position:fixed;z-index:90;pointer-events:none;border:3px solid var(--t-sun);border-radius:20px;box-shadow:0 0 0 9999px rgba(20,10,30,.55);transition:all .45s var(--ease)}
#tour-cursor{position:fixed;z-index:95;pointer-events:none;width:42px;height:42px;transition:left .9s cubic-bezier(.4,0,.2,1),top .9s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
#tour-cursor .ripple{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:3px solid var(--t-sun);opacity:0}
#tour-cursor.tapping .ripple{animation:ripple 1.6s ease-out infinite}
@keyframes ripple{0%{transform:scale(.4);opacity:.9}70%{transform:scale(1.7);opacity:0}100%{opacity:0}}
#tour-bubble{position:fixed;z-index:96;width:min(390px,calc(100vw - 32px));background:var(--surface);border-radius:22px;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:12px;transition:top .4s var(--ease),left .4s var(--ease)}
.tb-step{font-size:.8rem;font-weight:800;color:var(--accent)}
.tb-hint{color:var(--high);font-weight:700;font-size:.9rem}
.tb-actions{display:flex;gap:6px;flex-wrap:wrap}.tb-actions .btn{min-height:44px;padding:0 14px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}.draw{stroke-dasharray:none;stroke-dashoffset:0}.drop.leave{opacity:0}}
</style>
</head>

 {t:{en:"What are sukuk?", ar:"ما هي الصكوك؟"}, b:{en:"Sukuk (صكوك) are Islamic investment certificates. When you buy one, you own a small share of a real asset or project, such as a building, a road or a fleet of planes. You earn a share of the income it makes, not interest.", ar:"الصكوك شهادات استثمار إسلامية. عندما تشتري صكاً تملك حصة صغيرة من أصل أو مشروع حقيقي، مثل مبنى أو طريق أو أسطول طائرات. وتحصل على حصة من الدخل الذي يحققه، لا على فائدة."},

 {t:{en:"How the money flows", ar:"كيف تتحرك الأموال"}, flow:true, b:{en:"A government or company needs money for a project. It sells sukuk to investors, and the money buys or builds the asset. The asset earns income, such as rent, and investors receive their share regularly. At the end, the issuer buys the asset back and investors get their money back.", ar:"تحتاج حكومة أو شركة إلى مال لمشروع، فتبيع صكوكاً للمستثمرين، ويُستخدم المال لشراء الأصل أو بنائه. يحقق الأصل دخلاً مثل الإيجار، ويحصل المستثمرون على حصتهم بانتظام. وفي النهاية تعيد الجهة المُصدرة شراء الأصل ويسترد المستثمرون أموالهم."}},
 {t:{en:"Sukuk vs bonds", ar:"الصكوك مقابل السندات"}, cmp:true, b:{en:"Both can pay regular income, but they work differently.", ar:"كلاهما قد يدفع دخلاً منتظماً، لكنهما يعملان بشكل مختلف."}},
 {t:{en:"Common types", ar:"أنواع شائعة"}, list:{en:[["Ijara","Leasing: you earn rent from an asset."],["Murabaha","Cost-plus sale: goods are bought and sold at an agreed profit."],["Musharaka","Partnership: you share in profits and losses."],["Wakala","Agency: a manager invests for you for a set fee."]], ar:[["إجارة","تأجير: تحصل على إيجار من أصل."],["مرابحة","بيع بالتكلفة مع ربح: تُشترى البضائع وتُباع بربح متفق عليه."],["مشاركة","شراكة: تتقاسم الأرباح والخسائر."],["وكالة","وكالة: يستثمر مدير نيابة عنك مقابل أجر محدد."]]},
  b:{en:"Different sukuk use different structures. The name tells you where the income comes from.", ar:"تستخدم الصكوك هياكل مختلفة، والاسم يخبرك من أين يأتي الدخل."}},
 {t:{en:"Risks to know", ar:"مخاطر يجب معرفتها"}, risks:{en:["The issuer may struggle to pay.","Prices can fall, for example when interest rates in the wider market rise.","Some sukuk are hard to sell quickly.","Structures differ, so check what you actually own."], ar:["قد تواجه الجهة المُصدرة صعوبة في الدفع.","قد تنخفض الأسعار، مثلاً عندما ترتفع أسعار الفائدة في السوق عموماً.","بعض الصكوك يصعب بيعها بسرعة.","الهياكل تختلف، لذا تحقق مما تملكه فعلاً."]},
  b:{en:"Sukuk are usually steadier than shares, but they are not risk-free.", ar:"الصكوك عادةً أكثر استقراراً من الأسهم، لكنها ليست خالية من المخاطر."}},
 {t:{en:"How people invest in sukuk", ar:"كيف يستثمر الناس في الصكوك"}, b:{en:"Most individuals invest through sukuk funds offered by banks and investment firms, which hold many sukuk at once. Governments and large companies in the UAE and the GCC issue sukuk, and Nasdaq Dubai is one of the world's main places where they are listed.", ar:"يستثمر معظم الأفراد عبر صناديق صكوك تقدمها البنوك وشركات الاستثمار، وتملك صكوكاً كثيرة دفعة واحدة. تُصدر الحكومات والشركات الكبرى في الإمارات والخليج صكوكاً، وناسداك دبي من أهم الأماكن في العالم لإدراجها."}, last:true}
];

 {q:{en:"When you buy a sukuk, you…", ar:"عندما تشتري صكاً، فأنت…"}, o:{en:["Own a share of a real asset","Lend money and earn interest","Buy shares in a bank"], ar:["تملك حصة من أصل حقيقي","تُقرض مالاً وتحصل على فائدة","تشتري أسهماً في بنك"]}, a:0, e:{en:"Sukuk represent part-ownership of an asset or project.", ar:"الصكوك تمثل ملكية جزئية لأصل أو مشروع."}},
 {q:{en:"Sukuk holders are paid from…", ar:"يحصل حملة الصكوك على عائدهم من…"}, o:{en:["Interest on a loan","Income from the asset, such as rent","A fixed gift from the government"], ar:["فائدة على قرض","دخل الأصل، مثل الإيجار","هبة ثابتة من الحكومة"]}, a:1, e:{en:"The income comes from the real asset or business activity.", ar:"الدخل يأتي من الأصل الحقيقي أو النشاط التجاري."}},

const MODULES=[
 {id:"m1",st:0,ic:"spark",t:{en:"Why invest at all?",ar:"لماذا نستثمر أصلاً؟"},link:{go:"calc",en:"Try the orange calculator",ar:"جرّب حاسبة البرتقال"},
  cards:[C("Prices rise a little every year. That's inflation. Money sitting in a current account slowly buys less.","ترتفع الأسعار قليلاً كل سنة، وهذا هو التضخم. المال المتروك في الحساب الجاري يشتري أقل مع الوقت."),
   C("Investing means putting money into things that can grow, like companies or funds, so it can keep up with rising prices or beat them.","الاستثمار يعني وضع المال في أشياء يمكن أن تنمو، مثل الشركات أو الصناديق، لتواكب ارتفاع الأسعار أو تتفوق عليه."),
   C("Investing isn't a way to get rich quickly. It helps savings grow steadily over many years, for goals like retirement or your children's education.","الاستثمار ليس طريقاً للثراء السريع، بل يساعد مدخراتك على النمو بثبات على مدى سنوات، لأهداف مثل التقاعد أو تعليم الأبناء.")],
  quiz:[Q("What does inflation do to cash over time?","ماذا يفعل التضخم بالنقد مع الوقت؟",["It slowly buys less","It grows by itself","Nothing"],["يشتري أقل تدريجياً","ينمو وحده","لا شيء"],0,"Prices rise, so the same money buys less.","ترتفع الأسعار فيشتري المال نفسه أقل."),
   Q("Investing is mainly…","الاستثمار في الأساس…",["A way to get rich quickly","A way to grow savings over many years","The same as gambling"],["طريق للثراء السريع","وسيلة لتنمية المدخرات على مدى سنوات","مثل المقامرة"],1,"Good investing is slow and steady, with a long-term goal.","الاستثمار الجيد بطيء وثابت ولهدف طويل الأجل.")]},
 {id:"m2",st:0,ic:"stocks",t:{en:"What is a stock?",ar:"ما هو السهم؟"},
  cards:[C("A stock, or share, is a small piece of ownership in a company. If a company has 1,000 shares and you own 10, you own 1% of it.","السهم جزء صغير من ملكية شركة. إذا كان للشركة 1,000 سهم وتملك 10 منها، فأنت تملك 1% منها."),
   C("You can earn in two ways: the share price can rise, and some companies pay part of their profit to owners as dividends.","يمكنك أن تربح بطريقتين: قد يرتفع سعر السهم، وبعض الشركات توزع جزءاً من أرباحها على الملاك.",{an:{en:"Like owning one apartment in a building. If the area becomes popular, your apartment is worth more.",ar:"مثل امتلاك شقة في بناية. إذا أصبحت المنطقة مرغوبة، ترتفع قيمة شقتك."}}),
   C("Prices also fall. If the company struggles, its shares can lose value, and you can get back less than you put in.","الأسعار تنخفض أيضاً. إذا تعثرت الشركة قد تفقد أسهمها قيمتها، فتسترد أقل مما دفعت.")],
  quiz:[Q("Owning a share means you…","امتلاك سهم يعني أنك…",["Lent money to the company","Own a small piece of the company","Work for the company"],["أقرضت الشركة مالاً","تملك جزءاً صغيراً من الشركة","تعمل في الشركة"],1,"A share is part-ownership.","السهم ملكية جزئية."),
   Q("Which is true?","أي العبارات صحيحة؟",["Share prices only go up","Share prices can go up and down","Dividends are guaranteed"],["أسعار الأسهم ترتفع فقط","أسعار الأسهم ترتفع وتنخفض","التوزيعات مضمونة"],1,"Prices move both ways, and dividends can be cut.","الأسعار تتحرك في الاتجاهين، والتوزيعات قد تُخفض.")]},
 {id:"m3",st:0,ic:"home",t:{en:"How the stock market works",ar:"كيف يعمل سوق الأسهم"},
  cards:[C("Shares are bought and sold on a stock exchange. In the UAE, the main ones are the Abu Dhabi Securities Exchange (ADX) and the Dubai Financial Market (DFM).","تُشترى الأسهم وتُباع في البورصة. وفي الإمارات أهمها سوق أبوظبي للأوراق المالية وسوق دبي المالي."),
   C("You don't trade on the exchange yourself. A licensed broker, often through a bank or an investing app, places your orders.","لا تتداول في البورصة بنفسك، بل يضع وسيط مرخص أوامرك، غالباً عبر بنك أو تطبيق استثمار."),
   C("Prices move with supply and demand. When more people want to buy than sell, the price rises. The reverse makes it fall.","تتحرك الأسعار مع العرض والطلب. عندما يريد الشراء أكثر ممن يريدون البيع يرتفع السعر، والعكس يخفضه.",{an:{en:"Like the gold souk: prices change during the day depending on how many people want to buy or sell.",ar:"مثل سوق الذهب: تتغير الأسعار خلال اليوم حسب عدد من يريد الشراء أو البيع."}})],
  quiz:[Q("In the UAE, shares are traded on…","في الإمارات تُتداول الأسهم في…",["ADX and DFM","Any website","Bank branches only"],["سوق أبوظبي وسوق دبي","أي موقع إلكتروني","فروع البنوك فقط"],0,"ADX and DFM are the UAE's main exchanges.","سوق أبوظبي وسوق دبي هما البورصتان الرئيسيتان."),
   Q("Why do prices move?","لماذا تتحرك الأسعار؟",["The government sets them daily","Supply and demand between buyers and sellers","They change randomly at midnight"],["تحددها الحكومة يومياً","العرض والطلب بين المشترين والبائعين","تتغير عشوائياً عند منتصف الليل"],1,"More buyers push prices up; more sellers push them down.","كثرة المشترين ترفع السعر وكثرة البائعين تخفضه.")]},
 {id:"m4",st:0,ic:"shield",t:{en:"Risk and return",ar:"المخاطرة والعائد"},
  cards:[C("Higher possible returns usually come with higher risk. A calm fund grows slowly; a single bold stock can jump or crash.","العوائد الأعلى المحتملة تأتي عادةً بمخاطر أعلى. الصندوق الهادئ ينمو ببطء، والسهم الجريء قد يقفز أو ينهار."),
   C("Time matters. Money you need within 2–3 years is safer in cash or low-risk options. Money for 10 years or more can ride out the ups and downs.","الوقت مهم. المال الذي تحتاجه خلال سنتين أو ثلاث أكثر أماناً نقداً أو في خيارات منخفضة المخاطر، والمال لعشر سنوات أو أكثر يتحمل التقلبات."),
   C("Only invest money you won't need soon, and keep an emergency fund first: a few months of expenses in cash.","استثمر فقط ما لن تحتاجه قريباً، واحتفظ أولاً بصندوق طوارئ: نفقات بضعة أشهر نقداً.")],
  quiz:[Q("Money you need next year should usually be…","المال الذي تحتاجه السنة القادمة يكون عادةً…",["In a volatile stock","In cash or a low-risk option","In a WhatsApp tip"],["في سهم متقلب","نقداً أو في خيار منخفض المخاطر","في نصيحة من واتساب"],1,"Short-term money shouldn't face big swings.","مال المدى القصير لا يجب أن يتعرض لتقلبات كبيرة."),
   Q("Higher possible returns usually mean…","العوائد الأعلى المحتملة تعني عادةً…",["Higher risk","No risk","Guaranteed profit"],["مخاطر أعلى","لا مخاطر","ربحاً مضموناً"],0,"Return and risk usually go together.","العائد والمخاطرة يسيران معاً عادةً.")]},
 {id:"m5",st:1,ic:"chart",t:{en:"Reading a stock page",ar:"قراءة صفحة سهم"},link:{go:"stocks",en:"Open the Stocks page",ar:"افتح صفحة الأسهم"},
  cards:[C("The price is what one share costs now. The change shows how much it moved today.","السعر هو ما يكلفه سهم واحد الآن، والتغير يوضح مقدار حركته اليوم."),
   C("P/E compares the price with yearly profit. Dividend yield is the yearly cash paid, as a percentage of the price. Volatility shows how bumpy the price is.","مكرر الربحية يقارن السعر بالربح السنوي. عائد التوزيعات هو النقد المدفوع سنوياً كنسبة من السعر. والتذبذب يوضح مدى تقلب السعر."),
   C("On the Stocks page, every number has a label (low, typical or high) compared with similar companies. Tap any number for a plain explanation.","في صفحة الأسهم لكل رقم تسمية (منخفض أو معتاد أو مرتفع) مقارنة بشركات مشابهة. اضغط على أي رقم لشرح مبسط.")],
  quiz:[Q("Dividend yield tells you…","عائد التوزيعات يخبرك…",["Yearly cash paid, as a % of the price","Tomorrow's price","The company's debt"],["النقد المدفوع سنوياً كنسبة من السعر","سعر الغد","ديون الشركة"],0,"It's like rent as a percentage of what you paid.","يشبه الإيجار كنسبة مما دفعت."),
   Q("A 'high' label on P/E means…","تسمية «مرتفع» على مكرر الربحية تعني…",["The stock is bad","It's higher than most similar companies, so look closer","You must sell"],["السهم سيئ","أعلى من معظم الشركات المشابهة، فتمعّن أكثر","يجب أن تبيع"],1,"Labels compare; they don't judge.","التسميات تقارن ولا تحكم.")]},
 {id:"m6",st:1,ic:"practice",t:{en:"Funds and index funds",ar:"الصناديق وصناديق المؤشرات"},
  cards:[C("A fund pools money from many people and invests it in many companies at once. One purchase gives you a slice of all of them.","الصندوق يجمع أموال كثيرين ويستثمرها في شركات كثيرة دفعة واحدة. بعملية شراء واحدة تحصل على حصة منها كلها.",{an:{en:"Like buying a mixed fruit basket instead of one fruit: one bad piece doesn't spoil the whole basket.",ar:"مثل شراء سلة فواكه مشكلة بدل نوع واحد: الثمرة الفاسدة لا تفسد السلة كلها."}}),
   C("An index fund simply copies a market list, like the S&P 500, which holds about 500 large US companies. Index funds usually have low fees.","صندوق المؤشر ينسخ قائمة سوق، مثل مؤشر S&P 500 الذي يضم نحو 500 شركة أمريكية كبيرة. ورسومه عادةً منخفضة."),
   C("Funds spread risk, but they still go down when the whole market falls.","الصناديق توزع المخاطر، لكنها تنخفض عندما يهبط السوق كله.")],
  quiz:[Q("An index fund…","صندوق المؤشر…",["Picks one hot stock","Copies a whole market list","Guarantees profit"],["يختار سهماً رائجاً واحداً","ينسخ قائمة سوق كاملة","يضمن الربح"],1,"It follows a list such as the S&P 500.","يتبع قائمة مثل S&P 500."),
   Q("Funds spread risk, but…","الصناديق توزع المخاطر، لكن…",["They can still fall with the market","They never fall","They pay fixed interest"],["قد تنخفض مع السوق","لا تنخفض أبداً","تدفع فائدة ثابتة"],0,"Market-wide falls affect funds too.","هبوط السوق العام يؤثر على الصناديق أيضاً.")]},
 {id:"m7",st:1,ic:"star",t:{en:"Dividends",ar:"التوزيعات"},
  cards:[C("Some companies share part of their profit with owners in cash. That's a dividend, usually paid once or twice a year.","بعض الشركات تتقاسم جزءاً من أرباحها مع الملاك نقداً، وهذه هي التوزيعات، وتُدفع عادةً مرة أو مرتين سنوياً."),
   C("You can spend dividends as income, or reinvest them to buy more shares, which helps your money snowball.","يمكنك إنفاق التوزيعات كدخل، أو إعادة استثمارها لشراء أسهم أكثر، فينمو مالك ككرة الثلج."),
   C("Dividends aren't guaranteed. A company can cut them if profits fall.","التوزيعات غير مضمونة، وقد تخفضها الشركة إذا انخفضت أرباحها.")],
  quiz:[Q("Reinvesting dividends helps because…","إعادة استثمار التوزيعات تفيد لأن…",["Growth earns more growth","It removes all risk","It's required by law"],["النمو يولّد نمواً أكبر","تلغي كل المخاطر","يفرضها القانون"],0,"That's the snowball effect.","هذا أثر كرة الثلج."),
   Q("Dividends are…","التوزيعات…",["Guaranteed forever","Not guaranteed, and can be cut","Paid daily"],["مضمونة للأبد","غير مضمونة وقد تُخفض","تُدفع يومياً"],1,"They depend on the company's profits.","تعتمد على أرباح الشركة.")]},
 {id:"m8",st:2,ic:"flag",t:{en:"Goals and timelines",ar:"الأهداف والمدد الزمنية"},
  cards:[C("Start with why: retirement, children's education, a home or a family legacy. Each goal has a date and an amount.","ابدأ بالسبب: التقاعد أو تعليم الأبناء أو منزل أو إرث للعائلة. لكل هدف موعد ومبلغ."),
   C("Goals further away can handle more ups and downs. Closer goals need steadier options.","الأهداف البعيدة تتحمل تقلبات أكثر، والقريبة تحتاج خيارات أكثر استقراراً."),
   C("Write it down: the goal, how much, by when, and how much you can set aside each month.","اكتبه: الهدف، والمبلغ، والموعد، وكم تستطيع أن تدّخر كل شهر.")],
  quiz:[Q("A good first step is…","خطوة أولى جيدة هي…",["Buying the most popular stock","Writing down your goal, amount and date","Asking a WhatsApp group"],["شراء السهم الأشهر","كتابة هدفك ومبلغه وموعده","سؤال مجموعة واتساب"],1,"A clear goal guides every choice.","الهدف الواضح يوجه كل قرار."),
   Q("A goal 15 years away can usually…","الهدف البعيد 15 سنة يمكنه عادةً…",["Handle more ups and downs","Only use cash","Not use investing"],["تحمل تقلبات أكثر","استخدام النقد فقط","عدم استخدام الاستثمار"],0,"Time helps smooth out the bumps.","الوقت يساعد على تخفيف التقلبات.")]},
 {id:"m9",st:2,ic:"leaf",t:{en:"Diversification",ar:"التنويع"},link:{go:"practice",en:"Try the diversification check",ar:"جرّب فحص التنويع"},
  cards:[C("Don't put all your eggs in one basket. Spread money across several companies, sectors and even countries.","لا تضع كل البيض في سلة واحدة. وزّع أموالك على عدة شركات وقطاعات وحتى دول."),
   C("If one investment falls, others may hold up, so the total moves more smoothly.","إذا هبط استثمار قد يصمد غيره، فيتحرك المجموع بسلاسة أكبر."),
   C("An index fund is an easy way to diversify. In Practice, the diversification check warns you when too much sits in one place.","صندوق المؤشر طريقة سهلة للتنويع. وفي التدريب ينبهك فحص التنويع عندما يتركز مالك في مكان واحد.")],
  quiz:[Q("Diversification means…","التنويع يعني…",["Spreading money across different investments","Buying one stock many times","Keeping only cash"],["توزيع المال على استثمارات مختلفة","شراء سهم واحد مرات كثيرة","الاحتفاظ بالنقد فقط"],0,"Different investments rarely all fall at once.","نادراً ما تهبط الاستثمارات المختلفة كلها معاً."),
   Q("Owning five banks is…","امتلاك خمسة بنوك…",["Very diversified","Less diversified than owning five different sectors","Risk-free"],["تنويع كبير","أقل تنويعاً من خمسة قطاعات مختلفة","بلا مخاطر"],1,"Similar companies tend to move together.","الشركات المتشابهة تتحرك معاً غالباً.")]},
 {id:"m10",st:2,ic:"practice",t:{en:"Monthly investing",ar:"الاستثمار الشهري"},
  cards:[C("Invest a fixed amount on the same day every month, whatever the market does.","استثمر مبلغاً ثابتاً في اليوم نفسه كل شهر مهما فعل السوق."),
   C("When prices are low, your money buys more. When they're high, it buys less. You don't need to guess the right moment.","عندما تنخفض الأسعار يشتري مالك أكثر، وعندما ترتفع يشتري أقل. لا تحتاج إلى تخمين اللحظة المناسبة."),
   C("It builds a habit and takes emotion out of investing.","يبني عادة ويُبعد المشاعر عن الاستثمار.")],
  quiz:[Q("Monthly investing helps because…","الاستثمار الشهري يفيد لأن…",["You don't need to guess the best time","Prices always rise","It avoids all losses"],["لا تحتاج إلى تخمين أفضل توقيت","الأسعار ترتفع دائماً","يمنع كل الخسائر"],0,"Steady habits beat guessing.","العادات الثابتة أفضل من التخمين."),
   Q("When prices drop, a fixed monthly amount…","عندما تنخفض الأسعار، المبلغ الشهري الثابت…",["Buys more shares","Buys fewer shares","Stops working"],["يشتري أسهماً أكثر","يشتري أسهماً أقل","يتوقف عن العمل"],0,"Lower prices mean more shares for the same money.","الأسعار الأقل تعني أسهماً أكثر بالمبلغ نفسه.")]},
 {id:"m11",st:2,ic:"leaf",t:{en:"Staying calm in a fall",ar:"الهدوء عند الهبوط"},link:{go:"practice",en:"Try a practice drop",ar:"جرّب هبوطاً تدريبياً"},
  cards:[C("Markets fall sometimes, even by 20–30%. It feels scary, but falls like this have happened many times before.","الأسواق تهبط أحياناً، حتى بنسبة 20 إلى 30%. الأمر مخيف، لكن هبوطاً كهذا حدث مرات كثيرة من قبل."),
   C("Selling in a panic turns a paper loss into a real one. Many investors who waited saw prices recover, though recovery is never guaranteed or on a schedule.","البيع بذعر يحوّل الخسارة على الورق إلى خسارة حقيقية. كثيرون ممن انتظروا رأوا الأسعار تتعافى، مع أن التعافي ليس مضموناً ولا له موعد."),
   C("Before selling, ask: has my goal changed, or just the price?","قبل البيع اسأل نفسك: هل تغير هدفي، أم السعر فقط؟")],
  quiz:[Q("When the market drops 20%, panic selling…","عندما يهبط السوق 20%، البيع بذعر…",["Locks in the loss","Always saves money","Is required"],["يثبّت الخسارة","يوفر المال دائماً","إلزامي"],0,"A loss becomes real when you sell.","تصبح الخسارة حقيقية عند البيع."),
   Q("A good question before selling is…","سؤال جيد قبل البيع هو…",["Has my goal or plan changed?","What did my neighbour do?","Is it Monday?"],["هل تغير هدفي أو خطتي؟","ماذا فعل جاري؟","هل اليوم الاثنين؟"],0,"Decide by your plan, not by fear.","قرر وفق خطتك لا وفق خوفك.")]},
 {id:"m12",st:3,ic:"check",t:{en:"Sharia screening",ar:"الفحص الشرعي"},link:{go:"stocks",en:"Filter compliant stocks",ar:"صفِّ الأسهم المتوافقة"},
  cards:[C("Sharia-compliant investing avoids businesses whose main activity isn't permissible, such as conventional interest-based banking, alcohol or gambling.","الاستثمار المتوافق مع الشريعة يتجنب الشركات التي نشاطها الرئيسي غير مباح، مثل البنوك التقليدية القائمة على الفائدة والكحول والقمار."),
   C("Screens also check money: debt is usually limited to about 30% of company value, and non-permissible income to about 5% of revenue.","يتحقق الفحص أيضاً من الأرقام: تُحدد الديون عادةً بنحو 30% من قيمة الشركة، والدخل غير المباح بنحو 5% من الإيرادات."),
   C("Scholars and boards can differ. Look for funds approved by a recognised Sharia board. On the Stocks page you can filter to compliant options.","قد يختلف العلماء والهيئات. ابحث عن صناديق معتمدة من هيئة شرعية معروفة. وفي صفحة الأسهم يمكنك عرض الخيارات المتوافقة فقط.")],
  quiz:[Q("Sharia screening checks…","الفحص الشرعي يتحقق من…",["The business activity and certain money ratios","Only the share price","The CEO's age"],["نشاط الشركة ونسب مالية معينة","سعر السهم فقط","عمر المدير التنفيذي"],0,"Both the business and the numbers matter.","النشاط والأرقام كلاهما مهم."),
   Q("A conventional bank usually…","البنك التقليدي عادةً…",["Passes easily","Doesn't pass, because most income is interest","Isn't screened"],["يجتاز بسهولة","لا يجتاز لأن معظم دخله فائدة","لا يُفحص"],1,"Interest-based income isn't permissible.","الدخل القائم على الفائدة غير مباح.")]},
 {id:"m13",st:3,ic:"book",sukuk:true,t:{en:"Sukuk",ar:"الصكوك"},link:{go:"sukuk",en:"Try a sukuk fund in Practice",ar:"جرّب صندوق صكوك في التدريب"}},
 {id:"m14",st:4,ic:"chart",t:{en:"Reading charts",ar:"قراءة الرسوم البيانية"},link:{go:"candles",en:"Switch to candles in Practice",ar:"انتقل إلى الشموع في التدريب"},
  cards:[C("A line chart joins the price from each day. If it slopes up, the price rose over that time.","الرسم الخطي يصل سعر كل يوم. إذا اتجه للأعلى فقد ارتفع السعر خلال تلك الفترة."),
   C("Candlestick charts show more. Each candle has a body, from the start price to the end price, and wicks for the highest and lowest prices.","رسوم الشموع تُظهر أكثر. لكل شمعة جسم من سعر البداية إلى سعر النهاية، وظلال لأعلى وأدنى سعر."),
   C("Green, hollow candles went up. Red, filled candles went down.","الشموع الخضراء المفرغة ارتفعت، والحمراء الممتلئة انخفضت.")],
  quiz:[Q("A red, filled candle means…","الشمعة الحمراء الممتلئة تعني…",["The price ended lower than it started","The price went up","The market was closed"],["انتهى السعر أقل مما بدأ","ارتفع السعر","كان السوق مغلقاً"],0,"Red and filled means a down period.","الأحمر الممتلئ يعني فترة هبوط."),
   Q("The thin wicks show…","الظلال الرفيعة توضح…",["The highest and lowest prices","The dividend","The company's profit"],["أعلى وأدنى سعر","التوزيعات","ربح الشركة"],0,"Wicks mark the range of the period.","الظلال تحدد مدى الفترة.")]},
 {id:"m15",st:4,ic:"stocks",t:{en:"Indicators",ar:"المؤشرات الفنية"},link:{go:"practice",en:"Try indicators in Practice",ar:"جرّب المؤشرات في التدريب"},
  cards:[C("Indicators are tools drawn on charts. The 50-day moving average smooths out daily noise to show the general direction.","المؤشرات أدوات تُرسم على الرسوم. المتوسط المتحرك لخمسين يوماً يخفف ضجيج الأيام ليُظهر الاتجاه العام."),
   C("The 52-week high and low show the year's price range. RSI scores recent strength from 0 to 100.","أعلى وأدنى سعر في 52 أسبوعاً يوضحان مدى السعر خلال السنة، ومؤشر RSI يقيس قوة الحركة الأخيرة من 0 إلى 100."),
   C("Indicators describe the past. Use them to understand what happened, not to predict.","المؤشرات تصف الماضي. استخدمها لفهم ما حدث، لا للتنبؤ.")],
  quiz:[Q("A moving average…","المتوسط المتحرك…",["Shows the general direction","Predicts tomorrow","Shows dividends"],["يُظهر الاتجاه العام","يتنبأ بالغد","يُظهر التوزيعات"],0,"It smooths out daily ups and downs.","يخفف تقلبات الأيام."),
   Q("Indicators are best used to…","أفضل استخدام للمؤشرات هو…",["Understand what happened","Guarantee profits","Replace planning"],["فهم ما حدث","ضمان الأرباح","الاستغناء عن التخطيط"],0,"They look backward.","هي تنظر للخلف.")]},
 {id:"m16",st:4,ic:"stocks",t:{en:"Up and down: long and short",ar:"الصعود والهبوط: الشراء والبيع على المكشوف"},
  cards:[C("Going long means buying and hoping the price rises. Going short is the reverse: you profit if the price falls.","الشراء يعني أن تشتري وتأمل ارتفاع السعر، والبيع على المكشوف هو العكس: تربح إذا هبط السعر."),
   C("With a short, losses have no ceiling, because a price can keep rising. You also pay fees to borrow the shares.","في البيع على المكشوف لا سقف للخسائر لأن السعر قد يواصل الارتفاع، كما تدفع رسوماً لاقتراض الأسهم."),
   C("Many Islamic finance scholars consider conventional short selling not Sharia-compliant, and most long-term investors never short.","يرى كثير من علماء المالية الإسلامية أن البيع على المكشوف التقليدي غير متوافق مع الشريعة، ومعظم المستثمرين طويلي الأجل لا يستخدمونه.")],
  quiz:[Q("Going short means you gain if…","البيع على المكشوف يعني أنك تربح إذا…",["The price falls","The price rises","Nothing changes"],["هبط السعر","ارتفع السعر","لم يتغير شيء"],0,"Shorting is the reverse of buying.","هو عكس الشراء."),
   Q("Why is shorting riskier than buying?","لماذا البيع على المكشوف أخطر من الشراء؟",["Losses have no ceiling","It's always free","Prices can't rise"],["لا سقف للخسائر","مجاني دائماً","الأسعار لا ترتفع"],0,"A price can keep rising without limit.","قد يواصل السعر الارتفاع بلا حد.")]},
 {id:"m17",st:5,ic:"shield",t:{en:"Spotting scams",ar:"كشف الاحتيال"},link:{go:"scam",en:"Open the Scam check",ar:"افتح فحص الاحتيال"},
  cards:[C("Warning signs: guaranteed returns, pressure to act now, VIP WhatsApp or Telegram groups, and requests to send money or crypto.","علامات التحذير: عوائد مضمونة، وضغط للتصرف فوراً، ومجموعات واتساب أو تيليجرام VIP، وطلب تحويل أموال أو عملات رقمية."),
   C("Always check that a firm is licensed. The SCA for the UAE, the DFSA in DIFC and the FSRA in ADGM keep public registers.","تحقق دائماً من ترخيص الجهة. هيئة الأوراق المالية والسلع في الإمارات، وسلطة دبي للخدمات المالية في مركز دبي المالي، وسلطة تنظيم الخدمات المالية في سوق أبوظبي العالمي لديها سجلات عامة."),
   C("If in doubt, don't send money. Paste any tip into the Scam check.","إذا شككت فلا تحوّل المال. الصق أي نصيحة في فحص الاحتيال.")],
  quiz:[Q("'Guaranteed 20% a month' is…","«ربح مضمون 20% شهرياً» هو…",["A scam warning sign","Normal","A government bond"],["علامة احتيال","أمر طبيعي","سند حكومي"],0,"No real investment guarantees returns like that.","لا يوجد استثمار حقيقي يضمن عوائد كهذه."),
   Q("Before investing with a firm, check…","قبل الاستثمار مع جهة، تحقق من…",["It's licensed by a UAE regulator","It has many followers","It replies quickly"],["أنها مرخصة من جهة رقابية إماراتية","أن لديها متابعين كثيرين","أنها ترد بسرعة"],0,"Licences can be checked on the regulators' registers.","يمكن التحقق من التراخيص في سجلات الجهات الرقابية.")]},
 {id:"m18",st:5,ic:"info",t:{en:"Fees and costs",ar:"الرسوم والتكاليف"},
  cards:[C("Fees eat into returns. Look for trading fees, fund management fees and currency conversion costs.","الرسوم تأكل من العوائد. انتبه لرسوم التداول ورسوم إدارة الصناديق وتكاليف تحويل العملات."),
   C("A 1% yearly fee sounds small, but over 20 years it can take a big bite out of your growth.","رسوم 1% سنوياً تبدو صغيرة، لكنها على مدى 20 سنة قد تقتطع جزءاً كبيراً من نموك."),
   C("Compare costs before choosing a broker or fund, and avoid trading too often.","قارن التكاليف قبل اختيار وسيط أو صندوق، وتجنب التداول المتكرر.")],
  quiz:[Q("Why do small fees matter?","لماذا تهم الرسوم الصغيرة؟",["They add up over many years","They don't","They're refunded"],["تتراكم على مدى سنوات","لا تهم","تُسترد"],0,"Fees compound against you.","الرسوم تتراكم ضدك."),
   Q("Trading very often usually…","التداول المتكرر عادةً…",["Raises your costs","Removes fees","Is free"],["يرفع تكاليفك","يلغي الرسوم","مجاني"],0,"Each trade can cost money.","كل صفقة قد تكلف مالاً.")]},
 {id:"m19",st:5,ic:"home",t:{en:"Getting started safely",ar:"البداية بأمان"},
  cards:[C("Choose a broker licensed in the UAE. You'll need your Emirates ID and to answer questions about your experience.","اختر وسيطاً مرخصاً في الإمارات. ستحتاج إلى هويتك الإماراتية والإجابة عن أسئلة حول خبرتك."),
   C("Start small, with money you won't need soon, and stick to your written plan.","ابدأ بمبلغ صغير لن تحتاجه قريباً، والتزم بخطتك المكتوبة."),
   C("Keep learning. Use Practice first, and review your plan a few times a year, not every day.","واصل التعلم. استخدم التدريب أولاً، وراجع خطتك بضع مرات في السنة لا كل يوم.")],
  quiz:[Q("Before opening an account, check the broker is…","قبل فتح حساب، تحقق من أن الوسيط…",["Licensed in the UAE","Popular on social media","Offering a bonus"],["مرخص في الإمارات","مشهور على وسائل التواصل","يقدم مكافأة"],0,"Licensing protects you.","الترخيص يحميك."),
   Q("A sensible start is…","البداية المعقولة هي…",["Small amounts, following your plan","All your savings at once","Borrowed money"],["مبالغ صغيرة وفق خطتك","كل مدخراتك دفعة واحدة","مال مقترض"],0,"Start small and build confidence.","ابدأ صغيراً وابنِ ثقتك.")]},
 {id:"m20",st:5,ic:"flag",finish:true,t:{en:"Your investing checklist",ar:"قائمة الاستثمار الخاصة بك"},
  cards:[C("You made it to the finish line. Before investing real money, check that you have:","وصلت إلى خط النهاية. قبل استثمار مال حقيقي، تأكد أن لديك:",{risks:{en:["An emergency fund of a few months' expenses","A written goal, amount and date","A risk level that suits your timeline","A broker licensed in the UAE","A diversified, low-cost plan","A promise to yourself to stay calm in a fall"],ar:["صندوق طوارئ يغطي نفقات بضعة أشهر","هدف مكتوب بمبلغه وموعده","مستوى مخاطرة يناسب مدتك الزمنية","وسيط مرخص في الإمارات","خطة متنوعة منخفضة التكلفة","وعد لنفسك بالهدوء عند الهبوط"]}})],
  quiz:[Q("What should come before investing real money?","ما الذي يجب أن يسبق استثمار مال حقيقي؟",["An emergency fund and a written plan","A hot tip","Borrowing money"],["صندوق طوارئ وخطة مكتوبة","نصيحة رائجة","الاقتراض"],0,"Safety first, then a plan.","الأمان أولاً ثم الخطة.")]}
];

const KEY="stocksplained-proto-v2", START_T=249, SIM_Y=10, MAX_T=249+252*10;
function defaults(){ return {lang:"en", size:0, name:"", level:"beginner", goal:"retire", depth:0, speak:true, mode:"simple", unlocked:false, onboarded:false,
  xp:0, xpKeys:[], badges:[], streak:1, lastDay:"", period:"1y", quiz:{day:"", idx:0, right:0, done:false, answered:null}, newsRead:[], metricsSeen:[], indSeen:[],
  calc:{w:100, y:15, i:3}, shOnly:false, sk:{step:0, q:0, ans:null, right:0, done:false, quiz:false}, demo:{chart:"line", mode:"steady", cash:100000, units:{}, trades:[], t:START_T, crash:null, sel:"U5F", ind:{}, coach:[], soldSinceCrash:false, shorts:{}}}; }
function load(){ const d=defaults(); try{ const p=JSON.parse(localStorage.getItem(KEY)||"null"); if(p){ return Object.assign(d,p,{demo:Object.assign(d.demo,p.demo||{}), calc:Object.assign(d.calc,p.calc||{}), quiz:Object.assign(d.quiz,p.quiz||{}), sk:Object.assign(d.sk,p.sk||{})}); } }catch(e){} return d; }
let S=load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
(function streak(){ const today=new Date().toISOString().slice(0,10); if(S.lastDay!==today){ const y=new Date(Date.now()-864e5).toISOString().slice(0,10); S.streak = S.lastDay===y ? S.streak+1 : 1; S.lastDay=today; save(); } })();

const HIST={}, INTRA={};
function histP(a){ if(HIST[a.id]) return HIST[a.id]; const base=series(a).p; let s=a.seed*104729+7; const rnd=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
  const dv=a.vol/100/Math.sqrt(252), mu=(a.mu||.06)/252, back=[]; let q=base[0];
  for(let j=0;j<1010;j++){ const z=(rnd()+rnd()+rnd()-1.5)*2; q=q/(1+mu+dv*z); back.unshift(q); }
  return HIST[a.id]=back.concat(base.slice(0,START_T+1)); }
function dayBars(a,d){ const k=a.id+":"+d; if(INTRA[k]) return INTRA[k]; let s=(a.seed*31+d)*9973+11; const rnd=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
  const p0=priceAt(a,d-1), p1=priceAt(a,d), n=60, sd=a.vol/100/Math.sqrt(252*n)*1.1; let w=[0]; for(let i=1;i<=n;i++) w.push(w[i-1]+(rnd()+rnd()+rnd()-1.5)*2*sd);
  const out=[]; for(let i=0;i<=n;i++){ const f=i/n; out.push(p0*(1+w[i]-f*w[n])*Math.pow(p1/p0,f)); } return INTRA[k]=out; }

function portfolio(){ let inv=0; const per=[]; ASSETS.forEach(a=>{ const u=S.demo.units[a.id]||0; if(u>1e-9){ const v=u*priceNow(a); inv+=v; per.push({a,u,v}); } });
  Object.keys(S.demo.shorts||{}).forEach(id=>{ const sh=S.demo.shorts[id], a=assetById(id); if(sh&&sh.u>0&&a){ const v=sh.u*(2*sh.p0-priceNow(a)); inv+=v; per.push({a,u:sh.u,v,short:true}); } });
  return {inv, per, total:inv+S.demo.cash}; }
function shortValue(id){ const sh=S.demo.shorts[id], a=assetById(id); return sh.u*(2*sh.p0-priceNow(a)); }
function ownHTML(){ const sel=assetById(S.demo.sel), u=S.demo.units[sel.id]||0, sh=(S.demo.shorts||{})[sel.id]; let h=u>0?t("owned",{u:num(u,2),v:aed(u*priceNow(sel))}):esc(t("none_owned"));
  if(sh&&sh.u>0){ const pl=shortValue(sel.id)-sh.u*sh.p0; h+=`<br><span class="${pl>=0?"up":"down"}">${t("short_line",{u:num(sh.u,2),p:num(sh.p0),pl:`<bdi class="num">${pl<0?"−":"+"}AED ${num(Math.abs(pl),0)}</bdi>`})}</span>`; } return h; }

  modal(`<div class="row between"><h2>${icon("down")} ${esc(t("short_t"))}</h2><button class="iconbtn" data-action="close-modal" aria-label="${esc(t("close"))}">${icon("x")}</button></div>

   <div class="warn stack" style="gap:6px"><b>${esc(t("short_risk_t"))}</b><ul style="margin:0;padding-inline-start:1.2em;display:flex;flex-direction:column;gap:6px">${["short_r1","short_r2","short_r3","short_r4"].map(k=>`<li>${esc(t(k))}</li>`).join("")}</ul></div>
   <p class="muted small">${esc(t("short_r5"))}</p>${!ex?`<p class="note">${esc(t("short_explore"))}</p>`:""}
   <div class="row">${trade&&ex?`<button class="btn btn-primary" data-action="short-ok" data-trade="1">${esc(t("short_ok"))}</button>`:`<button class="btn btn-primary" data-action="short-ok">${esc(t("short_ok_learn"))}</button>`}<button class="btn" data-action="close-modal">${esc(t("short_no"))}</button></div>`); }
function doShort(){ const d=S.demo, a=assetById(d.sel), v=+$("#amt").value; if(!(v>0)){ toast(esc(t("enter_amt"))); return; } if(v>d.cash+1e-6){ toast(esc(t("no_cash"))); return; }
  const p=priceNow(a), u=v/p, old=d.shorts[a.id]; d.cash-=v;
  d.shorts[a.id]= old&&old.u>0 ? {u:old.u+u, p0:(old.u*old.p0+u*p)/(old.u+u)} : {u, p0:p}; d.trades.push({id:a.id,t:d.t,side:"ss"}); save(); render(false); toast(esc(t("shorted",{n:L(a),v:aedTxt(v)})));
  coach(`You've placed a bet that ${a.en}'s price will fall (called "going short"). If the price falls, you make money. If it rises, you lose money, and there's no limit to how high a price can go. Press "+1 month" to see what happens.`,`لقد راهنت على أن سعر ${a.ar} سيهبط (يُسمى «البيع على المكشوف»). إذا هبط السعر تربح، وإذا ارتفع تخسر، ولا حد لمدى ارتفاع السعر. اضغط «+شهر» لترى ما يحدث.`); }
function doCover(id, auto){ const d=S.demo, a=assetById(id), sh=d.shorts[id]; if(!sh||!sh.u) return; const v=Math.max(0,shortValue(id)), pl=v-sh.u*sh.p0; d.cash+=v; delete d.shorts[id]; d.trades.push({id,t:d.t,side:"cv"}); save();
  const res=`${pl<0?"−":"+"}AED ${num(Math.abs(pl),0)}`;
  if(auto){ coach(STR.en.margin_call.replace("{n}",a.en).replace("{v}",res), STR.ar.margin_call.replace("{n}",a.ar).replace("{v}",res)); toast(esc(t("margin_call",{n:L(a),v:res}))); }
  else { toast(esc(t("covered",{n:L(a),v:res}))); coach(pl>=0?`Your bet that ${a.en} would fall made ${res}, because the price went down after you placed it.`:`Your bet that ${a.en} would fall lost ${res}, because the price went up instead. With this kind of bet, a rising price is what costs you money.`, pl>=0?`ربح رهانك على هبوط ${a.ar} مبلغ ${res}، لأن السعر انخفض بعد أن وضعته.`:`خسر رهانك على هبوط ${a.ar} مبلغ ${res}، لأن السعر ارتفع بدلاً من ذلك. في هذا النوع من الرهانات، ارتفاع السعر هو ما يكلفك المال.`); } }
function checkMargin(){ let hit=false; Object.keys(S.demo.shorts||{}).forEach(id=>{ const sh=S.demo.shorts[id]; if(sh&&sh.u>0&&priceNow(assetById(id))>=1.5*sh.p0){ doCover(id,true); hit=true; } }); return hit; }
function riskInfo(){ const P=portfolio(); if(!P.inv) return {level:-1}; let wv=0; P.per.forEach(p=>wv+=p.v/P.total*p.a.vol); const mx=Math.max(...P.per.map(p=>p.v/P.inv));
  let level=wv<6?0:wv<14?1:2; if(mx>.6&&P.inv/P.total>.3) level=Math.min(2,level+1); if(P.per.some(p=>p.short)) level=2; return {level, conc:mx>.6}; }

function holdingCost(id){ const d=S.demo; if(d.cost&&d.cost[id]) return d.cost[id];
  let u=0,c=0; (d.trades||[]).forEach(tr=>{ if(tr.id!==id) return; if(tr.side==="s"){ u=0; c=0; } else if(tr.side==="b"){ const a=assetById(id), pp=tr.p||priceAt(a,tr.t); c+=tr.v||0; if(!tr.v) c=NaN; } }); return c>0?c:null; }
function pfDonut(rows,total){ const R=70, C=2*Math.PI*R; let off=0;
  const segs=rows.filter(r=>r.v>0).map(r=>{ const f=r.v/total, dash=f*C; const el=`<circle r="${R}" cx="90" cy="90" fill="none" stroke="${r.color}" stroke-width="26" stroke-dasharray="${dash.toFixed(2)} ${(C-dash).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" class="pf-seg"><title>${esc(r.name)} ${num(f*100,1)}%</title></circle>`; off+=dash; return el; }).join("");
  return `<svg viewBox="0 0 180 180" class="pf-donut" role="img" aria-label="${S.lang==="ar"?"توزيع المحفظة":"Portfolio mix"}"><g transform="rotate(-90 90 90)">${segs}</g><text x="90" y="86" text-anchor="middle" class="pf-dt">${S.lang==="ar"?"الإجمالي":"Total"}</text><text x="90" y="106" text-anchor="middle" class="pf-dv">${esc(num(total/1000,1))}k</text></svg>`; }
function spark(a){ const e=S.demo.t, st=Math.max(0,e-249), ps=[]; for(let i=st;i<=e;i+=5) ps.push(priceAt(a,i)); ps.push(priceAt(a,e)); const lo=Math.min(...ps), hi=Math.max(...ps)||1;

  return `<svg viewBox="0 0 120 38" class="pf-spark" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${up?"var(--up)":"var(--down)"}" stroke-width="2.2" stroke-linejoin="round"/></svg>`; }

  else if(m==="bold"){ coach(`Your investments changed by ${ch>=0?"+":""}${num(ch,1)}% in this jump. Bold stocks can rise or fall a lot, so one month can look very different from the next. That's normal for this kind of stock.`,`تغيرت استثماراتك بنسبة ${num(ch,1)}% في هذه القفزة. الأسهم الجريئة قد ترتفع أو تنخفض كثيراً، لذا قد يختلف شهر كثيراً عن الذي يليه. هذا طبيعي لهذا النوع من الأسهم.`); }
  else if(m==="steady"){ coach(`Your investments changed by ${ch>=0?"+":""}${num(ch,1)}%. Steady funds usually move less, but they still dip sometimes. To see the general direction without the daily ups and downs, tap "Moving average" above the chart.`,`تغيرت استثماراتك بنسبة ${num(ch,1)}%. الصناديق الهادئة تتحرك عادةً أقل، لكنها تنخفض أحياناً. لترى الاتجاه العام دون تقلبات الأيام، اضغط «المتوسط المتحرك» فوق الرسم.`); }
  else { coach(`Your investments changed by ${ch>=0?"+":""}${num(ch,1)}%. Notice that each one moved differently. That's why owning a few different things helps: when one falls, another may hold up.`,`تغيرت استثماراتك بنسبة ${num(ch,1)}%. لاحظ أن كل استثمار تحرك بشكل مختلف. لهذا يفيد امتلاك أشياء مختلفة: عندما ينخفض أحدها قد يصمد الآخر.`); } }

/* ---------- Learning journey ---------- */
function jrState(){ if(!S.jr) S.jr={done:[],open:null,card:0,quiz:false,q:0,ans:null,right:0,complete:false,justDone:null}; if(S.sk&&S.sk.done&&!S.jr.done.includes("m13")) S.jr.done.push("m13"); return S.jr; }
function curIdx(){ const J=jrState(); const i=MODULES.findIndex(m=>!J.done.includes(m.id)); return i<0?MODULES.length:i; }
function jrLayout(){ const SP=150, SG=96; let y=60, pts=[], signs=[];
  MODULES.forEach((m,i)=>{ if(i===0||MODULES[i-1].st!==m.st){ signs.push({st:m.st,y:y+34}); y+=SG; } pts.push({x:300+Math.round(Math.sin(i*Math.PI/2)*175), y}); y+=SP; });
  return {pts, signs, H:y}; }
const jrSeg=(a,b)=>{ const dy=b.y-a.y; return `C${a.x} ${a.y+dy*.55} ${b.x} ${b.y-dy*.55} ${b.x} ${b.y}`; };
const jrPath=arr=>arr.map((p,i)=>i?jrSeg(arr[i-1],p):`M${p.x} ${p.y}`).join(" ");
function vJourney(){ const J=jrState(); if(J.open) return vModule();
  const Lo=jrLayout(), ci=curIdx(), all=[{x:300,y:0},...Lo.pts], N=MODULES.length, doneN=J.done.length;
  const jd=J.justDone!=null?J.justDone:null; const reach=Math.min(N, ci)+ (ci>=N?0:1);
  const staticReach = jd!=null ? Math.min(all.length-1, jd+1) : Math.min(all.length-1, reach);
  const seg = jd!=null && jd+2<all.length ? `M${all[jd+1].x} ${all[jd+1].y} ${jrSeg(all[jd+1],all[jd+2])}` : "";
  const stroke=(d,c,w,extra)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" vector-effect="non-scaling-stroke" ${extra||""}/>`;
  const svg=`<svg class="road-svg" viewBox="0 0 600 ${Lo.H}" preserveAspectRatio="none" aria-hidden="true">
    ${stroke(jrPath(all),"#EAD7C8",62)}${stroke(jrPath(all),"#4A3B52",48)}${stroke(jrPath(all),"rgba(255,255,255,.65)",3,'stroke-dasharray="16 18"')}
    ${staticReach>0?stroke(jrPath(all.slice(0,staticReach+1)),"var(--t-sun)",14):""}
    ${seg?stroke(seg,"var(--t-sun)",14,'id="jrSeg" pathLength="1" class="draw-seg"'):""}</svg>`;
  const signs=Lo.signs.map(sg=>`<div class="sign" style="top:${sg.y}px"><small>${esc(t("jr_stage",{n:sg.st+1}))}</small>${esc(L(STAGES[sg.st]))}</div>`).join("");
  const nodes=MODULES.map((m,i)=>{ const p=Lo.pts[i], done=J.done.includes(m.id), cur=i===ci && !(jd!=null && i===jd+1 && false), locked=!done&&i>ci; const st=done?"done":cur?"current":"locked";
    const side=p.x>330?"lbl-left":"lbl-right"; const xp=m.sukuk?40:25;
    return `<div class="cp ${st} ${side} ${jd!=null&&i===jd+1?"arriving":""}" style="left:${p.x/6}%;top:${p.y}px" data-i="${i}">
      <button class="cp-node" data-action="open-module" data-id="${m.id}" aria-label="${esc(t("jr_cp",{n:i+1}))}: ${esc(L(m.t))}">${done?icon("check"):locked?icon("lock"):m.finish?icon("flag"):icon(m.ic||"star")}<span class="cp-num">${i+1}</span></button>
      <button class="cp-label" data-action="open-module" data-id="${m.id}" tabindex="-1"><span class="eyebrow ${cur?"":"muted"}" style="${cur?"color:var(--accent)":""}">${esc(cur?t("jr_now"):t("jr_cp",{n:i+1}))}</span><b>${esc(L(m.t))}</b><span class="muted small">${esc(done?t("jr_done")+" ✓":t("jr_meta",{x:xp}))}</span></button></div>`; }).join("");
  const pinAt = jd!=null ? Lo.pts[jd] : (ci<N?Lo.pts[ci]:Lo.pts[N-1]);
  const pin=`<div class="pin" id="jrPin" style="left:${pinAt.x/6}%;top:${pinAt.y-40}px"><svg width="46" height="58" viewBox="0 0 46 58"><path d="M23 56 C23 56 4 34 4 22 a19 19 0 1 1 38 0 C42 34 23 56 23 56z" fill="var(--ink)" stroke="#fff" stroke-width="3"/><circle cx="23" cy="22" r="13" fill="var(--t-sun)"/><text x="23" y="27.5" text-anchor="middle" font-family="Rubik,sans-serif" font-weight="800" font-size="15" fill="var(--ink)">${esc((S.name||"S").slice(0,1).toUpperCase())}</text></svg></div>`;
  return `<section class="sheet" style="gap:10px"><div class="row between"><h2>${esc(t("tab_journey"))}</h2><span class="chip sample">${esc(t("jr_progress",{d:doneN,n:N}))}</span></div><p class="muted">${esc(t("jr_intro"))}</p>
     <div class="progress-road"><span style="width:${doneN/N*100}%"></span></div></section>
   <section class="road-wrap" style="height:${Lo.H+40}px">${svg}${signs}${nodes}${pin}<div class="finish" style="top:${Lo.pts[N-1].y+70}px">🏁</div></section>`; }
function afterJourney(){ const J=jrState(); if(J.open||view!=="learn"||learnTab!=="journey") return;

  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(target) target.scrollIntoView({block:"center", behavior: jd!=null&&!reduce?"smooth":"auto"});
  if(jd==null) return;
  const done=document.querySelector(`.cp[data-i="${jd}"]`); if(done){ done.classList.add("burst-host"); burst(done); }
  const segEl=document.getElementById("jrSeg"), pin=document.getElementById("jrPin"), wrap=document.querySelector(".road-wrap");

  if(!segEl||!pin||reduce){ if(pin&&MODULES[jd+1]){ const p=jrLayout().pts[jd+1]; pin.style.left=(p.x/6)+"%"; pin.style.top=(p.y-40)+"px"; } finish(); return; }
  const len=segEl.getTotalLength(), sx=wrap.clientWidth/600, t0=performance.now()+900, dur=1300;
  const step=now=>{ const k=Math.max(0,Math.min(1,(now-t0)/dur)), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2; const pt=segEl.getPointAtLength(len*e);
    pin.style.left=(pt.x/6)+"%"; pin.style.top=(pt.y-40)+"px"; if(k<1) requestAnimationFrame(step); else finish(); };
  requestAnimationFrame(step); }
function burst(host){ const b=document.createElement("div"); b.className="burst"; b.innerHTML=Array.from({length:12},(_,i)=>`<i style="--a:${i*30}deg;--c:${["var(--t-sun)","var(--accent-2)","var(--t-mint)","var(--t-sky)"][i%4]}"></i>`).join(""); host.appendChild(b); setTimeout(()=>b.remove(),1600); }

// ---- Real-life scenario: weekly leftover salary over 30 years (S&P 500 total returns 1995–2024, dividends reinvested) ----
const SP_TR=[37.58,22.96,33.36,28.58,21.04,-9.10,-11.89,-22.10,28.68,10.88,4.91,15.79,5.49,-37.00,26.46,15.06,2.11,16.00,32.39,13.69,1.38,11.96,21.83,-4.38,31.49,18.40,28.71,-18.11,26.29,25.02];
let SAL={sal:15000, spend:12000, raise:3, infl:2.5};
try{ const v=JSON.parse(localStorage.getItem("stocksplained-sal")||"null"); if(v) Object.assign(SAL,v); }catch(e){}
function salData(){ const leftM=Math.max(0,SAL.sal-SAL.spend), wk0=leftM*12/52; let fund=0, bank=0, put=0, wk=wk0; const F=[0],B=[0],P=[0], dep=[];
  for(let y=0;y<30;y++){ const rw=Math.pow(1+SP_TR[y]/100,1/52)-1, bw=Math.pow(1.03,1/52)-1;
    for(let w=0;w<52;w++){ fund=fund*(1+rw)+wk; bank=bank*(1+bw)+wk; put+=wk; }
    F.push(fund); B.push(bank); P.push(put); dep.push(wk); wk*=1+SAL.raise/100; }
  let worst={y:0,ch:0}; for(let y=1;y<=30;y++){ const growth=(F[y]-F[y-1]-dep[y-1]*52)/Math.max(1,F[y-1]); if(F[y-1]>0&&growth<worst.ch) worst={y,ch:growth}; }
  const realF=F[30]/Math.pow(1+SAL.infl/100,30);
  return {leftM, wk0, wkEnd:dep[29], F,B,P, worst, realF}; }
function salChart(D){ const W=720,H=300,pl=12,pr=12,top=20,bot=34, mx=Math.max(...D.F,...D.B)*1.06, x=k=>pl+k*(W-pl-pr)/30, y=v=>top+(1-v/mx)*(H-top-bot);

  g+=`<path d="${path(D.F)}L${x(30)},${H-bot}L${x(0)},${H-bot}Z" fill="var(--accent-2)" opacity=".14"/>`;

  const level=["Simple: no jargon, short sentences, one everyday UAE example (rent, villas, Sheikh Zayed Road traffic, the gold souk, oranges).","Intermediate: name the real term and how it is worked out, still in plain words.","Professional: precise terms, limitations and related measures."][S.depth];
  const history=chat.slice(0,-1).filter(c=>c.text).slice(-8).map(c=>(c.role==="user"?"User: ":"ELI5: ")+c.text).join("\n");
  const prompt=`You are ELI5, the plain-language explainer inside Stocksplained, an education-only app for UAE residents aged 40 to 60 who are new to investing.

- All companies, funds and prices in the app are fictional sample data for learning; say so if it matters.

${history}

  try{ await SAMPLE(prompt,{cache:false, modelTier:"quick", onText:({text})=>{ bot.text=text==="Thinking..."?"":text; updLastMsg(); }}).then(r=>{ bot.text=(r&&r.text)||bot.text; });
  }catch(err){ const code=err&&err.code; bot.text = code==="rate_limited"?t("eli5_rate"): code==="not_granted"? (SAMPLE=null, offlineAnswer(q)) : (err&&err.text)||t("eli5_err"); }

  case "coach-say": { const x=(S.demo.coach||[])[+a.dataset.i]; if(x) speakOut(x[S.lang]||x.en); break; }
  case "short-learn": shortModal(false); break;
  case "short": if(!S.xpKeys.includes("short-learn")) shortModal(true); else doShort(); break;
  case "short-ok": { const tr=a.dataset.trade==="1"; closeModal(); award("short-learn",15,t("xp_short")); if(tr) doShort(); break; }
  case "cover": doCover(d.sel,false); render(false); break;
  case "pause": if(a.dataset.r==="worry"){ $("#modalRoot .modal").innerHTML=`<h2>${esc(t("pause_t"))}</h2><p>${esc(t("pause_worry_msg"))}</p><div class="stack"><button class="btn btn-primary btn-block" data-action="close-modal">${esc(t("keep"))}</button><button class="btn btn-block" data-action="sell-anyway">${esc(t("sell_anyway"))}</button></div>`; } else doSell(); break;
  case "sell-anyway": doSell(); break;
  case "ff": fastForward(+a.dataset.n); break;
  case "drop": d.crash=d.t; d.soldSinceCrash=false; save(); updPractice(false); render(false);
    coach("Prices just fell in this practice. This is the moment many people panic and sell. But if you sell now, a loss that's only on paper becomes a real one. Press \"+1 year\" to see what happens if you wait.","هبطت الأسعار في هذا التدريب. هذه هي اللحظة التي يذعر فيها كثيرون ويبيعون. لكن إذا بعت الآن تتحول الخسارة التي على الورق إلى خسارة حقيقية. اضغط «+سنة» لترى ما يحدث إن انتظرت."); break;
  case "reset": S.demo=Object.assign(defaults().demo,{mode:d.mode, sel:d.sel, ind:d.ind}); save(); render(false); break;
  case "tab": learnTab=a.dataset.tab; render(true); break;
  case "strat": openStrat=openStrat===a.dataset.id?null:a.dataset.id; if(openStrat) award("strat-"+a.dataset.id,15,t("xp_strat")); render(false); break;
  case "try": if(a.dataset.id==="salary"){ award("strat-salary",15,t("xp_strat")); const el=$("#salary"); if(el) el.scrollIntoView({behavior:"smooth"}); break; } { const s=STRATS.find(x=>x.id===a.dataset.id); award("strat-"+s.id,15,t("xp_strat")); d.mode=s.id==="divi"?"balanced":s.id==="short"?"bold":"steady"; d.sel=ASSETS.find(x=>x.risk===d.mode).id; save(); setView("practice"); toast(esc(t("try_toast",{s:L(s.t)}))); break; }
  case "quiz": { const set=quizSet(), Q=set[S.quiz.idx], i=+a.dataset.i; S.quiz.answered=i; if(i===Q.a){ S.quiz.right++; award("quiz-"+today()+"-"+S.quiz.idx,10,t("xp_quiz")); } save(); render(false); break; }
  case "quiz-next": { const n=quizSet().length; S.quiz.answered=null; if(S.quiz.idx+1>=n) S.quiz.done=true; else S.quiz.idx++; save(); render(false); break; }
  case "scam-sample": scamText=t("scam_sample_text"); scamResult=null; render(false); break;
  case "scam-check": scamText=$("#scamIn").value; if(!scamText.trim()){ toast(esc(t("scam_empty"))); break; } scamResult=FLAGS.filter(f=>f.re.test(scamText)); award("scam",20,t("xp_scam")); render(false); break;
 } });
function markNews(id){ if(!S.newsRead.includes(id)){ S.newsRead.push(id); save(); award("news-"+id,5,t("xp_news")); } }

document.addEventListener("change",e=>{ if(e.target.id==="shOnly"){ S.shOnly=e.target.checked; save(); render(false); } });
document.addEventListener("change",e=>{ if(e.target.id==="cReal"){ S.calc.real=e.target.checked; save(); updCalc(false); const g=$("#growth"); if(g) g.innerHTML=growthChart(calcData(),true); } });
document.addEventListener("change",e=>{ if(e.target.id==="autoRead"){ S.autoRead=e.target.checked; save(); if(!S.autoRead) stopSpeak(); } });
document.addEventListener("change",e=>{ if(e.target.id!=="cCur") return; const on=e.target.checked; S.calc.cur=on;
  if(on){ S.calc.prevI=S.calc.i; S.calc.i=CUR_INFL.r; } else { S.calc.i=S.calc.prevI!=null?S.calc.prevI:3; }
  save(); const sl=$("#cI"); sl.value=S.calc.i; sl.disabled=on; $("#cCurNote").hidden=!on; updCalc(false); });
document.addEventListener("input",e=>{ const id=e.target.id;
  if(id==="cW"||id==="cY"||id==="cI"){ S.calc[{cW:"w",cY:"y",cI:"i"}[id]]=+e.target.value; save(); updCalc(); document.querySelectorAll('[data-action="calc-w"]').forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.v===S.calc.w))); clearTimeout(updCalc._x); updCalc._x=setTimeout(()=>award("calc",10,t("xp_calc")),800); }
  if(id==="sSal"||id==="sSpend"||id==="sRaise"||id==="sInfl"){ SAL[{sSal:"sal",sSpend:"spend",sRaise:"raise",sInfl:"infl"}[id]]=+e.target.value; updSal(); clearTimeout(updSal._x); updSal._x=setTimeout(()=>award("salary-sim",10,t("xp_strat")),800); }
  if(id==="obName"){ ob.name=e.target.value; S.name=e.target.value.trim().slice(0,24); save(); updName(); }
  if(id==="scamIn") scamText=e.target.value; });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(tour) endTour(false); else if($("#modalRoot").innerHTML&&S.onboarded) closeModal(); else if(drawer) closeDrawer(); } });

/* ---------- Routing ---------- */
function fromHash(){ const h=location.hash.slice(1);
  if(h.startsWith("stock-")){ const id=h.slice(6).toUpperCase(); if(assetById(id)){ curAsset=id; view="stocks"; return; } }
  if(h==="scam"){ view="learn"; learnTab="scam"; return; }
  view=["home","stocks","news","practice","learn"].includes(h)?h:"home"; if(view==="stocks") curAsset=null; }
addEventListener("hashchange",()=>{ if(suppressHash){ suppressHash=false; return; } fromHash(); closeDrawer(); render(true); scrollTo({top:0}); });
fromHash(); render(true); if(!S.onboarded) onboarding();
</script>
